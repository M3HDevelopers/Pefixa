<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Inner Hexagon Shape -->
  <path d="M 100 30 L 155 65 L 155 135 L 100 170 L 45 135 L 45 65 Z" 
        fill="#000000" 
        stroke="#ffffff" 
        stroke-width="2.5"/>
  
  <!-- Stylized P with Document -->
  <g transform="translate(100, 100)">
    <!-- Document outline -->
    <rect x="-25" y="-35" width="50" height="70" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2" 
          rx="3"/>
    
    <!-- P letter integrated -->
    <path d="M -15 -20 L -15 20 M -15 -20 L 5 -20 Q 15 -20 15 -10 Q 15 0 5 0 L -15 0" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Accent dots -->
    <circle cx="10" cy="15" r="2" fill="#ffffff"/>
    <circle cx="10" cy="22" r="2" fill="#ffffff"/>
  </g>
  
  <!-- Corner accents -->
  <path d="M 20 20 L 35 20 M 20 20 L 20 35" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <path d="M 180 20 L 165 20 M 180 20 L 180 35" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <path d="M 20 180 L 35 180 M 20 180 L 20 165" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <path d="M 180 180 L 165 180 M 180 180 L 180 165" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>
